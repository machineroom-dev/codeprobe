name: Plugin Evals

# Runs the codeprobe regression evals (`claude plugin eval`) on pull requests and
# gates on "planted bugs still found": a suite threshold plus a hard second gate
# that fails the job if any audit-full `critical-*` grader failed in any run.
#
# Required setup (one-time, manual):
#   - Repo secret `CODEPROBE_EVAL_API_KEY`: an Anthropic API key used only by the
#     eval step. An OAuth token can be substituted instead; see the Claude Code
#     CI docs for the env var that carries it.
#
# Cost: a full run is roughly $30 at the default per-case run counts, so the
# ceiling below (--max-cost-usd 40) leaves headroom and aborts runaway runs.
#
# Fork PRs are skipped (no secrets, and --trust-plugin must not run untrusted
# code). A maintainer runs the suite on a fork branch via workflow_dispatch
# after reading the diff.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.claude-plugin/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref supersedes the in-flight run, so superseded runs
# do not keep billing.
concurrency:
  group: evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  evals:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap socat jq

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          # The installer puts the binary in ~/.local/bin; later steps need it on PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check version sync
        run: bash scripts/check_version_sync.sh

      - name: Validate plugin manifest
        run: claude plugin validate . --strict

      - name: Run evals
        id: eval
        env:
          # Eval runs call the API as this credential. An OAuth token can be
          # substituted here per the Claude Code CI docs.
          ANTHROPIC_API_KEY: ${{ secrets.CODEPROBE_EVAL_API_KEY }}
        run: |
          # --allow-tools is variadic, so it must stay the last option.
          claude plugin eval . \
            --json results.json \
            --threshold 0.8 \
            --ablation none \
            --no-publish \
            --trust-plugin \
            --scaffold \
            --max-cost-usd 40 \
            --model claude-opus-5-5 \
            --judge-model claude-sonnet-5-5 \
            --allow-tools Write "Bash(python3 *)" "Bash(mkdir *)" "Bash(wc *)" "Bash(date *)"

      # Second gate on the same run (not a second run): dropping a planted
      # Critical must block regardless of the aggregate score. Runs even when
      # the eval step failed its threshold, so the log names the lost plants.
      - name: Gate on planted Criticals
        if: ${{ !cancelled() && steps.eval.conclusion != 'skipped' }}
        run: |
          set -euo pipefail
          f=results.json
          if [ ! -s "$f" ]; then
            echo "::error::plants-survive gate: $f is missing or empty"
            exit 1
          fi
          # One line per problem. A missing audit-full case, a case with no runs,
          # or a run with zero critical-* graders is a problem too, so a partial
          # run cannot pass vacuously. Run numbers are 1-based.
          problems="$(jq -r '
            [.cases[] | select(.name == "audit-full")] as $cases
            | if ($cases | length) == 0 then
                "case audit-full not found in results"
              else
                $cases[]
                | (.arms.with // []) as $runs
                | if ($runs | length) == 0 then
                    "case audit-full has no runs in arms.with"
                  else
                    ($runs | to_entries[]) as $r
                    | [$r.value.graders[]? | select(.name | startswith("critical-"))] as $crit
                    | if ($crit | length) == 0 then
                        "run \($r.key + 1) of \($runs | length): no critical-* graders found"
                      else
                        $crit[]
                        | select(.passed != true)
                        | "run \($r.key + 1) of \($runs | length): grader \(.name) did not pass"
                      end
                  end
              end
          ' "$f")"
          if [ -n "$problems" ]; then
            echo "plants-survive gate FAILED:"
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$problems"
            exit 1
          fi
          checked="$(jq '[.cases[] | select(.name == "audit-full") | .arms.with[].graders[] | select(.name | startswith("critical-"))] | length' "$f")"
          echo "plants-survive gate passed: $checked critical-* grader results, all passed"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/**/report.html
          if-no-files-found: warn
